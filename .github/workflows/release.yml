name: Release

on:
  workflow_run:
    workflows: ["Version Bump"]
    types: [completed]

permissions:
  contents: write

jobs:
  # Resolve the tag exactly once. Every other job checks out that ref, so a
  # commit landing mid-run cannot make the build jobs and the release job
  # disagree about which version they are publishing.
  prepare:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      fresh: ${{ steps.tag.outputs.fresh }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag=$(git describe --tags --abbrev=0)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # Belt and braces: never overwrite the assets of a release that
          # already exists, whatever caused this workflow to fire.
          set +e
          gh release view "$tag" >/dev/null 2>&1
          status=$?
          set -e
          case "$status" in
            0)
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "$tag is already released; nothing to do." ;;
            1)
              echo "fresh=true" >> "$GITHUB_OUTPUT"
              echo "Releasing $tag" ;;
            *)
              # Anything else is an API problem, not proof the release is
              # absent. Refuse rather than risk overwriting a real release.
              echo "gh release view failed with status $status; refusing to publish."
              exit 1 ;;
          esac

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.fresh == 'true' }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: docker-dbake-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: docker-dbake-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            name: docker-dbake-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: docker-dbake-darwin-arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # --locked so every platform's binary is built from the same dependency
      # tree that CI tested.
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cp target/${{ matrix.target }}/release/docker-dbake ${{ matrix.name }}
          chmod +x ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: docker-dbake-*
