name: Audit

# Deliberately NOT part of "CI": a newly published advisory against a transitive
# dependency should raise a flag, not silently halt every release and turn all
# open PRs red without a line of code changing.
on:
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  push:
    branches: [master]
    paths: ["Cargo.toml", "Cargo.lock"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  # rustsec/audit-check writes a check run when it has something to report.
  checks: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
